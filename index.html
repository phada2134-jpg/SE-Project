
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Markdown Notebook | Studio Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap');
        
        * { 
            -webkit-tap-highlight-color: transparent; 
            scrollbar-width: thin;
            scrollbar-color: #e2e8f0 transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            background-color: #ffffff;
            color: #1e293b;
        }

        /* HTML Preview Styling */
        .markdown-preview h1 { font-weight: 800; font-size: 2.5rem; margin-bottom: 1.5rem; color: #0f172a; line-height: 1.1; letter-spacing: -0.04em; }
        .markdown-preview h2 { font-weight: 700; font-size: 1.8rem; margin-top: 2rem; margin-bottom: 1rem; color: #1e293b; border-bottom: 1px solid #f1f5f9; padding-bottom: 0.5rem; }
        .markdown-preview p { margin-bottom: 1.25rem; line-height: 1.8; color: #475569; font-size: 1.05rem; }
        .markdown-preview code { font-family: 'JetBrains Mono', monospace; background: #f1f5f9; color: #6366f1; padding: 0.2rem 0.4rem; border-radius: 6px; font-size: 0.9em; }
        .markdown-preview pre { background: #0f172a; color: #f8fafc; padding: 1.5rem; border-radius: 1rem; margin-bottom: 1.5rem; overflow-x: auto; font-family: 'JetBrains Mono', monospace; }
        
        /* Checkbox Task List Styling */
        .markdown-preview ul { list-style-type: none; padding-left: 0; margin-bottom: 1.25rem; }
        .markdown-preview li { display: flex; align-items: flex-start; gap: 0.85rem; margin-bottom: 0.6rem; color: #475569; font-size: 1.05rem; }
        .markdown-preview input[type="checkbox"] {
            margin-top: 0.4rem;
            width: 1.15rem;
            height: 1.15rem;
            accent-color: #6366f1;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .markdown-preview input[type="checkbox"]:checked + span {
            text-decoration: line-through;
            opacity: 0.5;
        }

        .markdown-preview blockquote { border-left: 5px solid #6366f1; padding: 1.25rem 2rem; font-style: italic; color: #64748b; margin: 2rem 0; background: #f8fafc; border-radius: 0 1.5rem 1.5rem 0; font-size: 1.1rem; }
        .markdown-preview img { border-radius: 1.5rem; width: 100%; margin: 3rem 0; box-shadow: 0 20px 40px -10px rgba(0,0,0,0.06); }

        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        
        .shortcut-text { color: #94a3b8; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; }
        
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.98) translateY(-4px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-menu { animation: fadeInScale 0.12s cubic-bezier(0.4, 0, 0.2, 1) forwards; }

        @media print {
            aside, header, footer { display: none !important; }
            .markdown-preview { padding: 0 !important; max-width: 100% !important; }
            .flex-1 { height: auto !important; overflow: visible !important; }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>

    <!-- Export PDF button for the demo HTML preview -->
    <button id="exportPdfBtn" style="position: fixed; right: 20px; bottom: 20px; background:#6366f1; color:white; border:none; padding:12px 16px; border-radius:12px; box-shadow:0 6px 18px rgba(99,102,241,0.25); cursor:pointer;">Export PDF</button>
    <script>
        document.getElementById('exportPdfBtn').addEventListener('click', function() {
            var element = document.getElementById('content');
            var opt = { margin: 0.5, filename: 'document.pdf', html2canvas: { scale: 2 }, jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' } };
            if (element) html2pdf().set(opt).from(element).save();
        });
    </script>

    <script type="module" src="index.tsx"></script>
</body>
</html>
